services:
  # PostgreSQL: the database. Its files live in the `octo-pgdata` volume.
  db:
    image: postgres:16-alpine
    container_name: octo-db
    environment:
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octo-dev-password}
      POSTGRES_DB: octo
    volumes:
      - octo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octo -d octo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # FastAPI backend + the built frontend, on one port.
  octo:
    build: .
    container_name: octo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://octo:${POSTGRES_PASSWORD:-octo-dev-password}@db:5432/octo
      # Signs login tokens. Set a long random value in .env for anything beyond local testing.
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-please-use-a-long-random-value}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      DEFAULT_MONTHLY_AMOUNT: ${DEFAULT_MONTHLY_AMOUNT:-4500}
      # true = create demo customers on the first start (set false for a real deployment).
      SEED_DEMO: ${SEED_DEMO:-true}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
    volumes:
      # Uploaded receipts and log files (app.log, error.log).
      - octo-data:/data
    restart: unless-stopped

volumes:
  octo-pgdata:
  octo-data:
