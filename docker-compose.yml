version: '3.8'

services:
  octo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octo-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    restart: unless-stopped
    networks:
      - octo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "com.example.description=Octo React Application"
      - "com.example.version=${APP_VERSION:-1.0.0}"
    security_opt:
      - no-new-privileges:true
    read_only_root_filesystem: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx

networks:
  octo-network:
    driver: bridge
